<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Invoice Tracker</title>
  <meta name="description" content="Track quotes, advances, work in progress, invoices and payments." />
  <meta name="theme-color" content="#1746d8" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Invoices" />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.module.js" crossorigin />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app"></div>
  <noscript>This app needs JavaScript enabled.</noscript>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js'))
  </script>
</body>
</html>
